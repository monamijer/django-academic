{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav class="mt-3 no-print">
  <ul class="pagination">
    {% if page_obj.has_previous %}
    <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if q %}&q={{ q }}{% endif %}" style="border-radius:8px; margin-right:.25rem; color:var(--brand-dark); border-color:var(--line);"><i class="bi bi-chevron-left"></i></a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link" style="border-radius:8px; border:none; color:var(--muted);">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
    <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if q %}&q={{ q }}{% endif %}" style="border-radius:8px; margin-left:.25rem; color:var(--brand-dark); border-color:var(--line);"><i class="bi bi-chevron-right"></i></a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
