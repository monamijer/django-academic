<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series TV — Suivi de séries</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="image/favicon.ico" type="image/x-icon">
</head>
<body>

  <!-- ===== LOGIN SCREEN ===== -->
  <div id="login" class="ecran-auth">
    <div class="auth-carte">
      <h1>📺 Series TV</h1>

      <div class="auth-tabs" role="tablist" aria-label="Authentification">
        <button type="button" class="auth-tab active" data-auth="connexion"
                role="tab" aria-selected="true" aria-controls="form-connexion" id="tab-connexion">
          Connexion
        </button>
        <button type="button" class="auth-tab" data-auth="inscription"
                role="tab" aria-selected="false" aria-controls="form-inscription" id="tab-inscription">
          Inscription
        </button>
      </div>

      <form id="form-connexion" class="form-auth auth-panel active"
            role="tabpanel" aria-labelledby="tab-connexion">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" required autocomplete="email">

        <label for="login-motdepasse">Mot de passe</label>
        <input id="login-motdepasse" type="password" required autocomplete="current-password">

        <button type="submit">Se connecter</button>
      </form>

      <form id="form-inscription" class="form-auth auth-panel" hidden
            role="tabpanel" aria-labelledby="tab-inscription">
        <label for="inscription-pseudo">Pseudo</label>
        <input id="inscription-pseudo" type="text" required autocomplete="nickname">

        <label for="inscription-email">Email</label>
        <input id="inscription-email" type="email" required autocomplete="email">

        <label for="inscription-motdepasse">Mot de passe (min. 8 caractères)</label>
        <input id="inscription-motdepasse" type="password" required minlength="8" autocomplete="new-password">

        <button type="submit">S'inscrire</button>
      </form>

      <p id="login-erreur" class="erreur" role="alert" aria-live="assertive"></p>
    </div>
  </div>

  <!-- ===== APPLICATION ===== -->
  <div id="app" class="hidden">
    <header class="app-header">
      <div class="header-top">
        <h1>📺 Series TV</h1>
        <div class="header-user">
          <span id="nom-utilisateur"></span>
          <span id="badge-role"></span>
          <button id="btn-deconnexion" class="btn-deconnexion" type="button">Déconnexion</button>
        </div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Sections principales">
        <button class="tab-btn active" data-tab="mes-series"
                role="tab" aria-selected="true" aria-controls="mes-series" id="onglet-mes-series">
          Mes séries
        </button>
        <button class="tab-btn" data-tab="decouvrir"
                role="tab" aria-selected="false" aria-controls="decouvrir" id="onglet-decouvrir">
          Découvrir (TMDB)
        </button>
        <button class="tab-btn admin-only hidden" data-tab="admin"
                role="tab" aria-selected="false" aria-controls="admin" id="onglet-admin">
          Admin
        </button>
      </nav>
    </header>

    <main>
      <!-- ===== MES SÉRIES ===== -->
      <section id="mes-series" class="tab-panel active" role="tabpanel"
               aria-labelledby="onglet-mes-series" tabindex="0">

        <form id="form-ajout-serie" class="card form-inline">
          <label for="input-titre" class="sr-only">Titre de la série</label>
          <input type="text" id="input-titre" placeholder="Titre de la série" required>

          <label for="input-genre" class="sr-only">Genre</label>
          <input type="text" id="input-genre" placeholder="Genre">

          <button type="submit">Ajouter</button>
        </form>

        <div class="card form-inline">
          <label for="select-tri" class="sr-only">Trier par</label>
          <select id="select-tri">
            <option value="titre-asc">Titre (A→Z)</option>
            <option value="titre-desc">Titre (Z→A)</option>
            <option value="annee-desc">Année (récente)</option>
            <option value="annee-asc">Année (ancienne)</option>
            <option value="note-desc">Note (meilleure)</option>
            <option value="progression-desc">Progression (élevée)</option>
          </select>

          <label for="input-filtre-genre" class="sr-only">Filtrer par genre</label>
          <input type="text" id="input-filtre-genre" placeholder="Filtrer par genre...">
        </div>

        <div id="liste-series" class="grid" aria-live="polite"></div>
      </section>

      <!-- ===== DÉCOUVRIR ===== -->
      <section id="decouvrir" class="tab-panel" role="tabpanel"
               aria-labelledby="onglet-decouvrir" tabindex="0" hidden>

        <form id="form-recherche-acteur" class="card form-inline">
          <label for="input-acteur" class="sr-only">Rechercher un acteur</label>
          <input type="text" id="input-acteur" placeholder="Rechercher un acteur...">
          <button type="submit">Rechercher</button>
        </form>

        <div id="resultats-acteurs" class="grid" aria-live="polite"></div>

        <div class="sous-nav" role="group" aria-label="Catégories de séries">
          <button type="button" class="souscat-btn" data-cat="populaires">Populaires</button>
          <button type="button" class="souscat-btn" data-cat="tendances">Tendances</button>
          <button type="button" class="souscat-btn" data-cat="mieux-notees">Mieux notées</button>
          <button type="button" class="souscat-btn" data-cat="diffusees-bientot">Bientôt</button>
        </div>

        <form id="form-recherche-tmdb" class="card form-inline">
          <label for="input-recherche" class="sr-only">Rechercher une série</label>
          <input type="text" id="input-recherche" placeholder="Rechercher une série...">
          <button type="submit">Rechercher</button>
        </form>

        <form id="form-decouvrir" class="card form-inline">
          <label for="select-genre" class="sr-only">Genre</label>
          <select id="select-genre">
            <option value="">Tous les genres</option>
          </select>

          <label for="input-annee" class="sr-only">Année</label>
          <input type="number" id="input-annee" placeholder="Année" min="1900" max="2100">

          <label for="input-note-min" class="sr-only">Note minimale</label>
          <input type="number" id="input-note-min" placeholder="Note min." min="0" max="10" step="0.5">

          <button type="submit">Filtrer</button>
        </form>

        <div id="resultats-tmdb" class="grid" aria-live="polite"></div>

        <nav id="pagination-tmdb" class="pagination hidden" aria-label="Pagination des résultats">
          <button type="button" id="btn-page-prec" class="btn-page">← Précédent</button>
          <span id="info-page" class="info-page" aria-live="polite">Page 1 / 1</span>
          <button type="button" id="btn-page-suiv" class="btn-page">Suivant →</button>
        </nav>
      </section>

      <!-- ===== ADMIN ===== -->
      <section id="admin" class="tab-panel" role="tabpanel"
               aria-labelledby="onglet-admin" tabindex="0" hidden>

        <div id="admin-stats" class="admin-stats"></div>

        <div class="card form-inline">
          <label for="select-statut-admin" class="sr-only">Filtrer par statut</label>
          <select id="select-statut-admin">
            <option value="">Tous les utilisateurs</option>
            <option value="EN_ATTENTE">En attente</option>
            <option value="APPROUVE">Approuvés</option>
            <option value="REFUSE">Refusés</option>
          </select>
          <button type="button" id="btn-rafraichir-admin">Rafraîchir</button>
        </div>

        <div id="admin-liste" class="admin-liste" aria-live="polite"></div>
      </section>
    </main>

    <div id="panneau-detail" class="panneau-detail hidden"
         role="dialog" aria-modal="true" aria-labelledby="titre-detail">
      <div class="panneau-contenu">
        <button id="btn-fermer-panneau" class="btn-fermer"
                aria-label="Fermer la fenêtre de détail">&times;</button>
        <div id="detail-contenu"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
